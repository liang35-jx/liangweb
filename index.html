<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的优雅首页</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }

        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
            padding: 0 20px;
        }

        header {
            background: #fff;
            color: #333;
            padding: 1rem 0;
            border-bottom: #e6e6e6 1px solid;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        header a {
            color: #333;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 16px;
        }

        header ul {
            padding: 0;
            list-style: none;
        }

        header li {
            display: inline;
            padding: 0 20px;
        }

        header #logo {
            float: left;
            font-size: 24px;
            font-weight: bold;
        }

        header nav {
            float: right;
            margin-top: 5px;
        }

        .hero {
            background: linear-gradient(to right, #6dd5ed, #2193b0);
            color: white;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-top: 60px; /* To offset the fixed header */
        }

        .hero h1 {
            font-size: 3rem;
            margin: 0;
        }

        .hero p {
            font-size: 1.2rem;
        }

        .features {
            padding: 40px 0;
            background: #fff;
        }

        .features h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .feature {
            background: #f4f4f9;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }

        .feature i {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #2193b0;
        }

        .cta {
            background: #333;
            color: #fff;
            padding: 40px 0;
            text-align: center;
        }

        .cta h2 {
            margin: 0 0 20px 0;
            font-size: 2rem;
        }

        .cta-button {
            background: #2193b0;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.2rem;
            transition: background 0.3s ease;
        }

        .cta-button:hover {
            background: #6dd5ed;
        }

        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 20px 0;
        }

        footer p {
            margin: 0;
        }
    </style>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>

    <header>
        <div class="container">
            <div id="logo"><a href="#">我的网站</a></div>
            <nav>
                <ul>
                    <li><a href="#">首页</a></li>
                    <li><a href="#">关于</a></li>
                    <li><a href="#">服务</a></li>
                    <li><a href="#">联系</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>欢迎来到我的网站</h1>
            <p>一个简洁、优雅且响应迅速的网页设计</p>
        </div>
    </section>

    <section class="features">
        <div class="container">
            <h2>我们的特色</h2>
            <div class="feature-grid">
                <div class="feature">
                    <i class="fas fa-cogs"></i>
                    <h3>易于定制</h3>
                    <p>代码结构清晰，方便您根据自己的需求进行修改。</p>
                </div>
                <div class="feature">
                    <i class="fas fa-palette"></i>
                    <h3>美观设计</h3>
                    <p>采用现代设计风格，给用户带来良好的视觉体验。</p>
                </div>
                <div class="feature">
                    <i class="fas fa-mobile-alt"></i>
                    <h3>响应式布局</h3>
                    <p>在不同尺寸的设备上都能完美显示。</p>
                </div>
            </div>
        </div>
    </section>

    <section class="cta">
        <div class="container">
            <h2>准备好开始了吗？</h2>
            <a href="#" class="cta-button">立即行动</a>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 我的网站. 版权所有.</p>
        </div>
    </footer>

</body>
</html>
